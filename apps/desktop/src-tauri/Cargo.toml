[package]
name = "deadalus-desktop"
version = "0.1.0"
description = "A local-first Agent Skills manager"
authors = ["Deadalus contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "deadalus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
notify = "8.2.0"
sha2 = "0.11.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.24.0", features = ["serde", "v4"] }
thiserror = "2.0.20"
pulldown-cmark = "0.13.4"
async-trait = "0.1.92"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml_edit = "0.25.13"
rfd = "0.15"
